<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: rgb(49, 51, 63);
      font-size: 14px;
    }

    .layer-list {
      display: grid;
      gap: 8px;
      padding: 2px 0 4px;
    }

    .layer-row {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(150px, 0.9fr);
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 7px 9px;
      border: 1px solid rgba(49, 51, 63, 0.16);
      border-radius: 8px;
      background: #fff;
      cursor: text;
      box-sizing: border-box;
      transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .layer-row:hover {
      border-color: rgba(49, 51, 63, 0.32);
      background: #fbfcfd;
    }

    .layer-row.selected {
      border-color: #ffb000;
      box-shadow: 0 0 0 1px rgba(255, 176, 0, 0.55);
      background: #fffaf0;
    }

    .layer-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .swatch {
      flex: 0 0 auto;
      box-sizing: border-box;
    }

    .swatch.marker {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .swatch.line {
      width: 34px;
      height: 0;
      border-top: 4px solid currentColor;
    }

    .layer-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      line-height: 1.25;
    }

    .label-input {
      width: 100%;
      min-width: 0;
      height: 34px;
      border: 1px solid rgba(49, 51, 63, 0.22);
      border-radius: 6px;
      padding: 6px 9px;
      font: inherit;
      box-sizing: border-box;
      outline: none;
      background: #fff;
      color: rgb(49, 51, 63);
    }

    .label-input:focus {
      border-color: #ffb000;
      box-shadow: 0 0 0 1px rgba(255, 176, 0, 0.45);
    }

    @media (max-width: 520px) {
      .layer-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    let args = { layers: [], selected: "", labels: {} };
    let labels = {};
    let drafts = {};
    let selected = "";
    let eventSeq = 0;
    let pendingFocusRaw = null;
    let pendingSendTimer = null;
    let pendingSend = null;
    let hasRendered = false;
    let readyAttempts = 0;
    let readyTimer = null;

    function sendStreamlitMessage(type, payload) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type,
        ...payload,
      }, "*");
    }

    function expectedHeight() {
      const layers = Array.isArray(args.layers) ? args.layers : [];
      return Math.max(64, layers.length * 58 + 8);
    }

    function setFrameHeight() {
      const measured = Math.ceil(document.documentElement.scrollHeight || document.body.scrollHeight || 0);
      const height = Math.max(expectedHeight(), measured);
      sendStreamlitMessage("streamlit:setFrameHeight", { height });
    }

    function collectLabelsFromInputs() {
      const nextLabels = {};
      document.querySelectorAll(".layer-row").forEach((row) => {
        const raw = sanitizeText(row.dataset.raw || row.title || "");
        const input = row.querySelector("input");
        const value = sanitizeText(input ? input.value : labels[raw] || "").trim();
        if (raw && value) {
          nextLabels[raw] = value;
        }
      });
      return nextLabels;
    }

    function setComponentValue(eventType, raw) {
      eventSeq += 1;
      const outgoingLabels = eventType === "commit" ? collectLabelsFromInputs() : labels;
      sendStreamlitMessage("streamlit:setComponentValue", {
        value: { selected, labels: outgoingLabels, eventType, raw, eventSeq },
        dataType: "json",
      });
    }

    function scheduleComponentValue(eventType, raw, delay = 120) {
      pendingSend = { eventType, raw };
      if (pendingSendTimer) {
        window.clearTimeout(pendingSendTimer);
      }
      pendingSendTimer = window.setTimeout(() => {
        const payload = pendingSend;
        pendingSend = null;
        pendingSendTimer = null;
        if (payload) {
          setComponentValue(payload.eventType, payload.raw);
        }
      }, delay);
    }

    function sanitizeText(value) {
      return String(value == null ? "" : value);
    }

    function updateSelectedRows() {
      document.querySelectorAll(".layer-row").forEach((row) => {
        row.classList.toggle("selected", row.dataset.raw === selected);
      });
    }

    function selectLayer(raw, eventType, focusAfter = false) {
      const wasSelected = selected === raw;
      selected = raw;
      if (focusAfter) {
        pendingFocusRaw = raw;
      }
      updateSelectedRows();
      if (!wasSelected) {
        scheduleComponentValue(eventType, raw);
      }
    }

    function selectLayerFromInput(raw, eventType) {
      const wasSelected = selected === raw;
      selected = raw;
      pendingFocusRaw = raw;
      updateSelectedRows();
      if (!wasSelected) {
        scheduleComponentValue(eventType, raw);
      }
    }

    function displayLabel(raw, value) {
      return value ? `${raw} -> ${value}` : raw;
    }

    function updateDraft(raw, value) {
      drafts = { ...drafts, [raw]: value };
      selected = raw;
      pendingFocusRaw = raw;
      updateSelectedRows();
      const row = document.querySelector(`.layer-row[data-raw="${CSS.escape(raw)}"]`);
      const label = row && row.querySelector(".layer-label-text");
      if (label) {
        label.textContent = displayLabel(raw, value);
      }
    }

    function commitDraft(raw) {
      labels = collectLabelsFromInputs();
      drafts = { ...labels };
      selected = raw;
      pendingFocusRaw = raw;
      updateSelectedRows();
      setComponentValue("commit", raw);
    }

    function render(fromStreamlit = false, focusRaw = null) {
      const root = document.getElementById("root");
      const layers = Array.isArray(args.layers) ? args.layers : [];
      root.innerHTML = "";
      const list = document.createElement("div");
      list.className = "layer-list";

      if (!layers.length) {
        const empty = document.createElement("div");
        empty.className = "layer-row";
        empty.textContent = "Layer editor did not receive any layers from Streamlit.";
        list.appendChild(empty);
        root.appendChild(list);
        setFrameHeight();
        return;
      }

      layers.forEach((layer) => {
        const raw = sanitizeText(layer.raw);
        const kind = sanitizeText(layer.kind || "marker");
        const color = sanitizeText(layer.color || "#4E79A7");
        const current = sanitizeText(drafts[raw] ?? labels[raw] ?? "");

        const row = document.createElement("div");
        row.className = `layer-row${raw === selected ? " selected" : ""}`;
        row.title = raw;
        row.dataset.raw = raw;
        row.addEventListener("pointerdown", (event) => {
            if (event.target && event.target.tagName === "INPUT") {
            return;
          }
          event.preventDefault();
          selectLayer(raw, "row", true);
          window.setTimeout(() => {
            const input = row.querySelector("input");
            if (input) input.focus();
          }, 0);
        });

        const meta = document.createElement("div");
        meta.className = "layer-meta";

        const swatch = document.createElement("span");
        swatch.className = `swatch ${kind === "line" ? "line" : "marker"}`;
        if (kind === "line") {
          swatch.style.color = color;
        } else {
          swatch.style.background = color;
        }

        const name = document.createElement("div");
        name.className = "layer-name";
        const label = document.createElement("span");
        label.className = "layer-label-text";
        label.textContent = displayLabel(raw, current);
        name.appendChild(label);

        meta.appendChild(swatch);
        meta.appendChild(name);

        const input = document.createElement("input");
        input.className = "label-input";
        input.type = "text";
        input.value = current;
        input.placeholder = raw;
        input.setAttribute("aria-label", `Legend name for ${raw}`);
        const chooseFromInput = (eventType) => selectLayerFromInput(raw, eventType);
        input.addEventListener("pointerdown", () => chooseFromInput("input-pointer"), { capture: true });
        input.addEventListener("focus", () => {
          selected = raw;
          pendingFocusRaw = raw;
          updateSelectedRows();
        }, { capture: true });
        input.addEventListener("input", (event) => updateDraft(raw, event.target.value));
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            commitDraft(raw);
            input.blur();
          }
        });

        row.appendChild(meta);
        row.appendChild(input);
        list.appendChild(row);
      });

      root.appendChild(list);
      setFrameHeight();

      const rawToFocus = focusRaw || pendingFocusRaw;
      if (fromStreamlit) {
        pendingFocusRaw = null;
      }
      if (rawToFocus) {
        window.setTimeout(() => {
          const rows = Array.from(document.querySelectorAll(".layer-row"));
          const match = rows.find((row) => row.title === rawToFocus);
          const input = match && match.querySelector("input");
          if (input && document.activeElement !== input) {
            input.focus();
            const end = input.value.length;
            input.setSelectionRange(end, end);
          }
        }, 0);
      }
    }

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type !== "streamlit:render") {
        return;
      }
      hasRendered = true;
      if (readyTimer) {
        window.clearInterval(readyTimer);
        readyTimer = null;
      }
      args = data.args || {};
      const previousDrafts = drafts;
      labels = { ...(args.labels || {}) };
      drafts = { ...labels };
      const activeRaw = sanitizeText(pendingFocusRaw || "");
      if (activeRaw && Object.prototype.hasOwnProperty.call(previousDrafts, activeRaw)) {
        drafts[activeRaw] = previousDrafts[activeRaw];
      }
      selected = sanitizeText(activeRaw || args.selected || "");
      render(true);
    });

    function announceReady() {
      sendStreamlitMessage("streamlit:componentReady", { apiVersion: 1 });
      readyAttempts += 1;
      if (hasRendered || readyAttempts >= 20) {
        window.clearInterval(readyTimer);
        readyTimer = null;
      }
    }

    announceReady();
    readyTimer = window.setInterval(announceReady, 250);
  </script>
</body>
</html>
